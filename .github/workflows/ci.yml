name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: this workflow only builds and tests.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: swift build
      - name: Test
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log
      - name: Show failed tests
        if: failure()
        run: |
          if [ -f test.log ]; then
            grep -E "error: -\[|error: .*XCT|: error:" test.log | head -20 | while IFS= read -r line; do echo "::error::$line"; done
          fi
      - name: Bundle
        run: make app
